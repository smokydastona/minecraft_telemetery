name: Build (Forge 1.20.1 / Fabric 26.2)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify locale sync and translation coverage
        shell: pwsh
        run: |
          ./tools/sync_lang_files.ps1
          $changes = git status --porcelain -- src/main/resources/assets/bassshakertelemetry/lang
          if ($changes) {
            Write-Host 'Locale files are out of sync with src/main/resources/assets/bassshakertelemetry/lang/en_us.json.'
            Write-Host 'Run ./tools/sync_lang_files.ps1 locally and commit the resulting locale updates.'
            git --no-pager diff -- src/main/resources/assets/bassshakertelemetry/lang
            exit 1
          }

          ./tools/validate_lang_files.ps1 -FailOnSuspiciousFallbacks $true -MaxSuspiciousPercent 35 -MaxSameAsEnglishPercent 15

      - name: Set up JDK 17 for Forge 1.20.1
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make root Forge wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew --no-daemon clean build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bassshakertelemetry-jars
          path: build/libs/*.jar
          if-no-files-found: error

  fabric:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Fabric wrapper executable
        run: chmod +x fabric/gradlew

      - name: Build Fabric sibling
        working-directory: fabric
        run: ./gradlew --no-daemon clean build

      - name: Upload Fabric build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bassshakertelemetry-fabric-jars
          path: fabric/build/libs/*.jar
          if-no-files-found: error

  neoforge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 25 for NeoForge 26.2
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true

      - name: Use clean NeoForge Gradle home
        run: echo "GRADLE_USER_HOME=${{ runner.temp }}/neoforge-gradle-home" >> "$GITHUB_ENV"

      - name: Make NeoForge wrapper executable
        run: chmod +x neoforge/gradlew

      - name: Build NeoForge sibling
        working-directory: neoforge
        run: ./gradlew --no-daemon --refresh-dependencies clean build --stacktrace

      - name: Inspect NeoForm patch inputs after build
        if: always()
        run: |
          echo 'NeoForge build files:'
          find neoforge/build -type f 2>/dev/null | sort | head -200 || true
          echo 'Resolved archives and patch-bundle entries:'
          find neoforge/build "$GRADLE_USER_HOME" -type f \( -name '*.jar' -o -name '*.zip' \) 2>/dev/null | while read -r archive; do
            entries=$(unzip -l "$archive" 2>/dev/null | grep -E 'patches\.lzma|patch(es)?/' || true)
            echo "--- $archive"
            if [ -n "$entries" ]; then echo "$entries"; else echo 'NO_PATCH_ENTRY_FOUND'; fi
          done

      - name: Upload NeoForge build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bassshakertelemetry-neoforge-jars
          path: neoforge/build/libs/*.jar
          if-no-files-found: error
